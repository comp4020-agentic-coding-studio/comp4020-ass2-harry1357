<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img">
  <title>An abstract tile: filled grid cells stepping diagonally across a spreadsheet</title>
  <rect width="600" height="600" fill="#e6e6e6"/>
  <g stroke="#0d0d0d" stroke-opacity="0.16" stroke-width="2">
    <path d="M0 100H600M0 200H600M0 300H600M0 400H600M0 500H600"/>
    <path d="M100 0V600M200 0V600M300 0V600M400 0V600M500 0V600"/>
  </g>
  <g fill="#4f46e5">
    <rect x="100" y="100" width="100" height="100"/>
    <rect x="200" y="200" width="100" height="100" fill-opacity="0.82"/>
    <rect x="300" y="300" width="100" height="100" fill-opacity="0.64"/>
    <rect x="400" y="400" width="100" height="100" fill-opacity="0.46"/>
  </g>
  <rect x="100" y="400" width="100" height="100" fill="#c2410c"/>
  <g stroke="#0d0d0d" stroke-width="4" fill="none">
    <path d="M100 100H500V500"/>
  </g>
</svg>
